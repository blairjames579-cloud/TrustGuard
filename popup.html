<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrustGuard Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e1e; color: #e0e0e0; width: 280px; padding: 15px; margin: 0; }
    h3 { margin-top: 0; font-size: 16px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 140px; overflow-y: auto; }
    li { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; font-size: 13px; }
    button { background: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; }
    .footer { text-align: center; border-top: 1px solid #333; padding-top: 10px; display: flex; justify-content: space-around; font-size: 12px; }
    .footer a { color: #ffdd59; text-decoration: none; font-weight: bold; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h3>🛡️ Whitelisted Domains</h3>
  <ul id="whitelistList"></ul>
  
  <div class="footer">
    <a href="https://ko-fi.com/YOUR_USERNAME" target="_blank">☕ Support</a>
    <a href="#" id="shareBtn">🔗 Share</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
